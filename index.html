    : `<p class="seg-p">${esc(s.text)}</p>`).join('');
  if (active){ P.segIdx = currentSegIndex(); paintSeg(false); }

  updateFollowBtn();
  updateUI();
  updateMini();
}

/* ---------- الانتقال من الرف إلى الحكاية ---------- */
function flight(fromEl, toEl, color, reverse){
  return new Promise(resolve => {
    if (!fromEl || !toEl || reduced() || !toEl.animate || !document.contains(fromEl)) return resolve(null);
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    if (!a.width || !b.width) return resolve(null);
    const vh = window.innerHeight;
    const h = Math.min(b.height, vh - Math.max(0, b.top) + 40);
    const g = document.createElement('div');
    g.className = 'ghost';
    Object.assign(g.style, { left:b.left+'px', top:b.top+'px', width:b.width+'px', height:h+'px', background:color });
    document.body.appendChild(g);
    const start = { transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/h})`, background:color, borderRadius:'8px' };
    const end   = { transform:'none', background:'#141E34', borderRadius:'28px' };
    const anim = g.animate(reverse ? [end, start] : [start, end], { duration: reverse ? 560 : 720, easing:'cubic-bezier(.2,.7,.15,1)', fill:'forwards' });
    anim.onfinish = () => resolve(g);
    anim.oncancel = () => { g.remove(); resolve(null); };
  });
}
function fadeOutGhost(g){
  if (!g) return;
  const a = g.animate([{opacity:1},{opacity:0}], { duration:320, fill:'forwards' });
  a.onfinish = () => g.remove();
}
function inView(el){
  if (!el || !document.contains(el)) return false;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.bottom > 0 && r.top < window.innerHeight && r.right > 0 && r.left < window.innerWidth;
}
function setInert(on){
  ['siteHeader','main','siteFooter'].forEach(id => { const el = document.getElementById(id); if (el) el.inert = on; });
}

let stageOpener = null, openedByPush = false, pendingFrom = null, busy = false;

async function openEpisode(ep, fromEl, animate){
  if (stageOpen){
    renderStage(ep); $('#stageScroll').scrollTop = 0; insertTape();
    $('#ep-title').focus({ preventScroll:true }); return;
  }
  stageOpen = true; busy = true;
  stageOpener = fromEl || stageOpener || null;
  const spine = fromEl && fromEl.classList && fromEl.classList.contains('spine') ? fromEl : null;
  if (animate && spine && !reduced()){
    spine.classList.add('chosen');
    document.body.classList.add('focusing');
    await wait(420);
  }
  renderStage(ep);
  const layer = $('#stage'), panel = $('#stagePanel');
  layer.hidden = false;
  $('#stageScroll').scrollTop = 0;
  setInert(true);
  document.body.classList.add('lock');
  panel.classList.remove('reveal');
  panel.classList.add('hidden-content');
  panel.style.visibility = 'hidden';
  void layer.offsetWidth;
  layer.classList.add('open');
  const g = animate ? await flight(fromEl, panel, (ep.cover && ep.cover.bg) || '#4A3022', false) : null;
  panel.style.visibility = '';
  panel.classList.remove('hidden-content');
  panel.classList.add('reveal');
  fadeOutGhost(g);
  insertTape();
  updateMini();
  $('#ep-title').focus({ preventScroll:true });
  document.title = `${ep.title} — ألف`;
  busy = false;
}

/* ---------- محاكاة جهاز الكاسيت ----------
   تعمل بلا صوت عندما لا يوجد ملف صوتي للحلقة؛ وإن وُجد الملف تتحكم أزرار الجهاز بالصوت الحقيقي */
const SIM = { ep:null, pos:0, mode:null, last:0, raf:0 };
const SIM_SPEED = { play:1, ff:24, rew:-24 };
const simDur = ep => (ep && ep.duration) || 1800;
const realFor = ep => !!ep && (hasAudio(ep) || (P.ep === ep.id && liveSrc()));
function deckKey(act, epId){
  const ep = epById(epId); if (!ep) return;
  if (realFor(ep)){
    if (act === 'deck-play') toggle(ep.id);
    else if (P.ep === ep.id && liveSrc()) skip(act === 'deck-rew' ? -15 : 15);
    else toast('ابدأ التشغيل أولاً.');
    return;
  }
  if (SIM.ep !== ep.id){ SIM.ep = ep.id; SIM.pos = 0; SIM.mode = null; }
  const want = act === 'deck-play' ? 'play' : act === 'deck-ff' ? 'ff' : 'rew';
  if (SIM.mode === want) simStop();
  else {
    if (want === 'rew' && SIM.pos <= 0) { toast('الشريط في بدايته.'); return; }
    if (want !== 'rew' && SIM.pos >= simDur(ep)) { toast('الشريط في نهايته. رجّعه أولاً.'); return; }
    SIM.mode = want; SIM.last = performance.now();
    cancelAnimationFrame(SIM.raf); SIM.raf = requestAnimationFrame(simTick);
  }
  updateDeck();
}
function simStop(){ SIM.mode = null; cancelAnimationFrame(SIM.raf); updateDeck(); }
function simTick(now){
  const ep = epById(SIM.ep);
  if (!ep || !SIM.mode || !stageOpen){ SIM.mode = null; updateDeck(); return; }
  const dt = Math.min(0.25, (now - SIM.last) / 1000); SIM.last = now;
  SIM.pos += dt * SIM_SPEED[SIM.mode];
  const dur = simDur(ep);
  if (SIM.pos <= 0){ SIM.pos = 0; SIM.mode = null; toast('رجع الشريط إلى بدايته.'); }
  else if (SIM.pos >= dur){ SIM.pos = dur; SIM.mode = null; toast('انتهى الوجه A. ما الذي بقي معك؟'); }
  updateDeck();
  if (SIM.mode) SIM.raf = requestAnimationFrame(simTick);
}
function updateDeck(){
  $$('.deck').forEach(d => {
    const ep = epById(d.dataset.deck); if (!ep) return;
    const real = realFor(ep);
    const live = real && P.ep === ep.id && liveSrc();
    let p, t, dur, mode;
    if (real){
      dur = live && isFinite(audio.duration) ? audio.duration : (ep.duration || 0);
      t = live ? (audio.currentTime || 0) : 0;
      mode = live && !audio.paused ? 'play' : null;
    } else {
      dur = simDur(ep);
      t = SIM.ep === ep.id ? SIM.pos : 0;
      mode = SIM.ep === ep.id ? SIM.mode : null;
    }
    p = dur ? Math.min(1, t / dur) : 0;
    const max = 74, min = 34;
    d.style.setProperty('--pa', (min + (max - min) * (1 - p)) + 'px');
    d.style.setProperty('--pb', (min + (max - min) * p) + 'px');
    d.style.setProperty('--pp', (p * 100) + '%');
    d.style.setProperty('--spd', mode === 'play' ? '3.2s' : '.45s');
    d.classList.toggle('moving', !!mode);
    d.classList.toggle('rew', mode === 'rew');
    d.classList.toggle('on', !!mode);
    const cnt = String(Math.floor(t / 2) % 1000).padStart(3, '0');
    $$('[data-counter] b', d).forEach((b, i) => { if (b.textContent !== cnt[i]) b.textContent = cnt[i]; });
    const tm = $('[data-deck-time]', d); if (tm) tm.textContent = `${fmt(t)} / ${fmt(dur || NaN)}`;
    const st = $('[data-deck-state]', d);
    if (st) st.textContent = mode === 'play' ? (real ? 'يعمل' : 'يدور · محاكاة بلا صوت') : mode === 'ff' ? 'تقديم سريع' : mode === 'rew' ? 'ترجيع' : (t > 0 ? 'متوقف' : 'جاهز');
    const keys = { 'deck-play':'play', 'deck-ff':'ff', 'deck-rew':'rew' };
    $$('.key[data-ctl^="deck-"]', d).forEach(k => {
      const on = mode === keys[k.dataset.ctl];
      k.classList.toggle('down', on);
      k.setAttribute('aria-pressed', String(on));
      if (k.dataset.ctl === 'deck-play'){
        const ic = on ? 'pause' : 'play';
        if (k.dataset.ic !== ic){ k.dataset.ic = ic; k.innerHTML = ICON[ic]; k.setAttribute('aria-label', on ? 'إيقاف الشريط' : 'تشغيل الشريط'); }
      }
    });
  });
}

function insertTape(){
  const deck = $('#stagePanel .deck'); if (!deck) return;
  if (reduced()) { deck.classList.add('inserted'); return; }
  setTimeout(() => deck.classList.add('inserted'), 260);
}

async function closeEpisode(){
  if (!stageOpen) return;
  if (document.body.classList.contains('khalwa-on')) exitKhalwa(true);
  const dlg = $('#bookDlg'); if (dlg.open){ dlgNav = true; closeDlg(); }
  stageOpen = false; busy = true;
  const deck = $('#stagePanel .deck');
  simStop(); SIM.ep = null; SIM.pos = 0;
  if (deck && deck.classList.contains('inserted') && !reduced()){ deck.classList.remove('inserted'); await wait(420); }
  const ep = epById(viewEpId);
  const layer = $('#stage'), panel = $('#stagePanel');
  const spine = $(`.spine[data-ep-link="${viewEpId}"]`);
  const target = inView(spine) ? spine : (inView(stageOpener) ? stageOpener : null);
  layer.classList.remove('open');
  if (target && !reduced()){
    const g = flight(target, panel, (ep && ep.cover && ep.cover.bg) || '#4A3022', true);
    panel.style.visibility = 'hidden';
    const ghost = await g;
    if (ghost) ghost.remove();
  } else {
    await wait(reduced() ? 0 : 300);
  }
  layer.hidden = true;
  panel.style.visibility = '';
  panel.classList.remove('reveal');
  setInert(false);
  document.body.classList.remove('lock');
  document.body.classList.remove('focusing');
  $$('.spine.chosen').forEach(s => s.classList.remove('chosen'));
  viewEpId = null;
  updateMini(); updateUI();
  const back = spine && document.contains(spine) ? spine : stageOpener;
  if (back && document.contains(back)) back.focus({ preventScroll:true });
  stageOpener = null;
  document.title = 'ألف — صوت، وحكاية، وشيء يشبه الأُلفة';
  busy = false;
}

function requestClose(){
  if (!stageOpen || busy) return;
  if (openedByPush){ openedByPush = false; history.back(); }
  else { history.replaceState(null, '', location.pathname + location.search + '#library'); closeEpisode(); }
}

/* ---------- نهاية الحلقة والتأمل ---------- */
function onEnded(){
  updateUI();
  if (stageOpen && viewEpId === P.ep && $('#reflect')){
    toast('انتهت الحلقة. خذ لحظة لنفسك.');
    if (!document.body.classList.contains('khalwa-on')){
      $('#reflect').scrollIntoView({ block:'start', behavior: reduced() ? 'auto' : 'smooth' });
      $('#reflect-q').focus({ preventScroll:true });
    }
  } else toast('انتهت الحلقة.');
  updateKhalwaText(true);
}
let saveT;
function saveReflection(epId, val){
  clearTimeout(saveT);
  const s = $('#saveState'); if (s) s.textContent = '';
  saveT = setTimeout(() => {
    const ok = val.trim() ? store.set('alef:reflection:' + epId, val) : store.del('alef:reflection:' + epId);
    if (s) s.textContent = ok ? 'حُفظ' : 'تعذّر الحفظ في هذا المتصفح';
  }, 500);
}

/* =========================================================
   وضع الخلوة
   ========================================================= */
let kEp = null, kReturn = null, kEnded = false;
const khalwaEpId = () => kEp || P.ep || viewEpId;
function enterKhalwa(){
  const ep = epById(viewEpId || P.ep); if (!ep) return;
  kEp = ep.id; kReturn = document.activeElement; kEnded = false;
  $('[data-bind="k-title"]').textContent = `الحلقة ${ar(ep.number)} · ${ep.title}`;
  $('[data-bind="k-text"]').textContent = '';
  $('#khalwa').hidden = false;
  document.body.classList.add('khalwa-on', 'lock');
  setInert(true);
  ['stage','miniBar'].forEach(id => { const el = document.getElementById(id); if (el) el.inert = true; });
  updateKhalwaText(); updateUI();
  $('#kExit').focus();
}
function exitKhalwa(silent){
  if ($('#khalwa').hidden) return;
  $('#khalwa').hidden = true;
  document.body.classList.remove('khalwa-on');
  ['stage','miniBar'].forEach(id => { const el = document.getElementById(id); if (el) el.inert = false; });
  if (!stageOpen){ setInert(false); document.body.classList.remove('lock'); }
  kEp = null;
  if (!silent && kReturn && document.contains(kReturn)) kReturn.focus();
  const cur = $('.seg.current');
  if (cur && P.follow && !silent) cur.scrollIntoView({ block:'center', behavior:'auto' });
  updateUI();
}
function updateKhalwaText(ended){
  if ($('#khalwa').hidden) return;
  const ep = epById(khalwaEpId()); if (!ep) return;
  const el = $('[data-bind="k-text"]');
  let txt;
  if (ended || kEnded){ kEnded = true; txt = 'ما الذي بقي معك؟'; }
  else if (ep.id === P.ep && syncActive() && P.segIdx >= 0) txt = ep.transcript[P.segIdx].text;
  else txt = ep.description;
  if (el.textContent === txt) return;
  if (reduced() || !el.textContent){ el.textContent = txt; return; }
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = txt; el.style.opacity = 1; }, 450);
}

/* =========================================================
   التفاعلات
   ========================================================= */
document.addEventListener('click', e => {
  const nav = e.target.closest('a[data-nav]');
  if (nav){
    e.preventDefault();
    const id = nav.getAttribute('href').slice(1);
    history.replaceState(null, '', location.pathname + location.search + '#' + id);
    goSection(id, true);
    return;
  }
  const epLink = e.target.closest('a[href^="#episode/"]');
  if (epLink){ pendingFrom = epLink; return; }
  const book = e.target.closest('[data-book]');
  if (book){ openBook(book.dataset.book, book); return; }
  const seg = e.target.closest('.seg');
  if (seg && syncActive()){
    audio.currentTime = Number(seg.dataset.start) || 0;
    P.follow = true; updateFollowBtn();
    if (audio.paused) play();
    return;
  }
  const c = e.target.closest('[data-ctl]'); if (!c) return;
  const act = c.dataset.ctl;
  const epId = c.hasAttribute('data-k') ? khalwaEpId() : c.dataset.ep;
  if (act === 'deck-play' || act === 'deck-rew' || act === 'deck-ff'){ deckKey(act, epId); return; }
  if (act === 'toggle') toggle(epId);
  else if (act === 'back' || act === 'fwd'){
    if (scopeEp(c) === P.ep && liveSrc()) skip(act === 'back' ? -15 : 15);
    else toast('ابدأ الاستماع أولاً.');
  }
  else if (act === 'khalwa') enterKhalwa();
  else if (act === 'khalwa-exit') exitKhalwa();
  else if (act === 'close-stage') requestClose();
  else if (act === 'follow'){
    P.follow = !P.follow; updateFollowBtn();
    if (P.follow){ const cur = $('.seg.current'); if (cur) cur.scrollIntoView({ block:'center', behavior: reduced() ? 'auto' : 'smooth' }); }
    if (!syncActive()) toast('ستعمل متابعة النص عندما يرافق النص الصوت.');
  }
  else if (act === 'clear-reflection'){
    const ta = $(`#refl-${c.dataset.ep}`); if (ta) ta.value = '';
    store.del('alef:reflection:' + c.dataset.ep);
    const s = $('#saveState'); if (s) s.textContent = 'مُسح';
    if (ta) ta.focus();
  }
});

document.addEventListener('input', e => {
  const c = e.target.closest('[data-ctl]'); if (!c) return;
  const act = c.dataset.ctl;
  if (act === 'seek'){
    P.seeking = true;
    c.style.setProperty('--p', (Number(c.value)/10) + '%');
    if (isFinite(audio.duration)) audio.currentTime = (Number(c.value)/1000) * audio.duration;
  }
  else if (act === 'vol') setVol(Number(c.value));
  else if (act === 'reflection') saveReflection(c.dataset.ep, c.value);
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-ctl]'); if (!c) return;
  const act = c.dataset.ctl;
  if (act === 'seek'){ P.seeking = false; updateUI(); }
  else if (act === 'rate') setRate(Number(c.value));
  else if (act === 'trial'){ P.trial = c.checked; P.segIdx = -1; refreshStage(); }
  else if (act === 'file'){
    const f = c.files && c.files[0]; if (!f) return;
    if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|wav|ogg|aac|flac|webm)$/i.test(f.name)){ toast('هذا الملف ليس ملفاً صوتياً.'); return; }
    const ep = epById(c.dataset.ep);
    attach(ep, URL.createObjectURL(f), 'local', f.name);
    toast('الملف جاهز. اضغط تشغيل.');
    const btn = $(`#stagePanel [data-ctl="toggle"][data-ep="${ep.id}"]`); if (btn) btn.focus();
  }
});
document.addEventListener('pointerup', () => { if (P.seeking){ P.seeking = false; updateUI(); } });

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.body.classList.contains('khalwa-on')){ e.preventDefault(); exitKhalwa(); return; }
  if ($('#bookDlg').open) return;
  if (stageOpen){ e.preventDefault(); requestClose(); }
});

audio.addEventListener('timeupdate', onTime);
audio.addEventListener('seeked', onTime);
['play','pause','loadedmetadata','durationchange','emptied'].forEach(ev => audio.addEventListener(ev, () => { updateUI(); if (ev === 'loadedmetadata') onTime(); }));
audio.addEventListener('play', () => { kEnded = false; });
audio.addEventListener('ended', onEnded);
audio.addEventListener('error', () => {
  if (!audio.getAttribute('src')) return;
  toast('تعذّر تحميل الملف الصوتي. تأكد من الرابط أو جرّب ملفاً آخر.');
  if (P.localUrl){ URL.revokeObjectURL(P.localUrl); P.localUrl = null; }
  audio.removeAttribute('src'); audio.load();
  P.ep = null; P.kind = null;
  refreshStage(); updateMini();
});

/* =========================================================
   التنقل
   ========================================================= */
const SECTIONS = ['top','library','today','books','chats','about'];
function goSection(id, smooth){
  const el = document.getElementById(id); if (!el) return;
  const go = () => {
    const y = id === 'top' ? 0 : el.getBoundingClientRect().top + window.scrollY - 64;
    window.scrollTo({ top:y, behavior: smooth && !reduced() ? 'smooth' : 'auto' });
    const h = el.querySelector('h1[tabindex],h2[tabindex]');
    if (h && smooth) h.focus({ preventScroll:true });
  };
  if (stageOpen) closeEpisode().then(go); else go();
}

function route(initial){
  if (location.hash.startsWith('#chat-')){ openChatLink(location.hash.slice(6), initial); return; }
  let [name, id] = (location.hash.slice(1) || 'top').split('/');
  try { id = decodeURIComponent(id || ''); } catch(err){}
  if (name === 'episode'){
    const ep = epById(id);
    if (ep){
      const from = pendingFrom || (!initial ? $(`.spine[data-ep-link="${ep.id}"]`) : null);
      pendingFrom = null;
      if (!initial) openedByPush = true;
      openEpisode(ep, from && inView(from) ? from : null, !initial);
      return;
    }
    name = 'top';
  }
  if (stageOpen){ openedByPush = false; closeEpisode(); return; }
  if (initial && SECTIONS.includes(name) && name !== 'top') setTimeout(() => goSection(name, false), 60);
}

/* القسم الحالي في القائمة */
function watchSections(){
  if (!('IntersectionObserver' in window)) return;
  const links = $$('.nav a');
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      let id = en.target.id; if (id === 'today') id = 'library';
      links.forEach(a => a.getAttribute('href') === '#' + id ? a.setAttribute('aria-current','true') : a.removeAttribute('aria-current'));
    });
  }, { rootMargin:'-45% 0px -50% 0px' });
  SECTIONS.forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
}
const head = $('#siteHeader');
const onScroll = () => head.classList.toggle('scrolled', window.scrollY > 40);
window.addEventListener('scroll', onScroll, { passive:true });

/* =========================================================
   دردشات — محاكاة: كل شيء محفوظ على هذا الجهاز فقط
   ========================================================= */
const CHAT_KEY = 'alef:chats';
const CH = { sel:null, role:'owner', pending:null, missing:null, confirmDel:false };
const ROLES = { owner:'أنا (المرسل)', a:'صديق أ', b:'صديق ب' };
const loadChats = () => { try { const v = JSON.parse(store.get(CHAT_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch(e){ return []; } };
const saveChats = list => store.set(CHAT_KEY, JSON.stringify(list));
const chatById = id => loadChats().find(c => c.id === id);
const maskEmail = e => { const [u, d] = String(e).split('@'); return (u ? u[0] : '') + '•••@' + (d || ''); };
const chatLink = id => (location.origin && location.origin !== 'null' ? location.origin : '') + location.pathname + '#chat-' + id;
const newId = () => { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(10)) : Array.from({length:10}, () => Math.random()*256|0); r.forEach(x => s += a[x % a.length]); return s; };
const timeLabel = t => { try { return new Date(t).toLocaleTimeString('ar-u-nu-arab', { hour:'numeric', minute:'2-digit' }); } catch(e){ return ''; } };
function updateChat(id, fn){ const list = loadChats(); const c = list.find(x => x.id === id); if (!c) return null; fn(c); saveChats(list); return c; }

function renderChats(focusSel){
  const list = loadChats().sort((a,b) => b.created - a.created);
  const c = CH.sel ? list.find(x => x.id === CH.sel) : null;
  if (CH.sel && !c && !CH.missing) CH.sel = null;
  $('#chats').innerHTML = `
    <div class="wrap">
      <div class="sec-head">
        <div>
          <p class="kicker">دردشات</p>
          <h2 id="chats-title" tabindex="-1">رابط لشخص واحد</h2>
          <p class="lede">افتح دردشة وأرسل رابطها لشخص واحد. أول من يفتحه تصبح الدردشة له وحده، مدى الحياة.</p>
        </div>
        <span class="demo-tag">محاكاة على هذا الجهاز فقط</span>
      </div>
      <div class="chat-grid">
        <aside class="chat-side">
          <form class="chat-new" id="chatNew" novalidate>
            <label for="chatTo">لمن هذه الدردشة؟ الاسم يظهر لك فقط</label>
            <input id="chatTo" type="text" maxlength="40" placeholder="مثلاً: صديقتي سارة" autocomplete="off">
            <button class="chat-btn" type="submit">${svg('<path d="M12 5v14M5 12h14"/>')}أنشئ رابطاً</button>
          </form>
          ${list.length ? `<div><h3 class="list-h">دردشاتك</h3>
          <ul class="chat-list">${list.map(x => `<li><button class="chat-item" type="button" data-chat="${esc(x.id)}" aria-current="${x.id === CH.sel}">
            <span class="nm">${esc(x.to || 'دردشة بلا اسم')}</span>
            <span class="pill${x.claimedBy ? ' locked' : ''}">${x.claimedBy ? 'مقفلة لشخص واحد' : 'بانتظار فتحها'}</span>
          </button></li>`).join('')}</ul></div>` : ''}
        </aside>
        <div class="chat-main" id="chatMain">${chatMainHTML(c)}</div>
      </div>
    </div>`;
  const ms = $('#chats .msgs'); if (ms) ms.scrollTop = ms.scrollHeight;
  if (focusSel){ const f = $(focusSel, $('#chats')); if (f) f.focus({ preventScroll:true }); }
}

function chatMainHTML(c){
  if (CH.missing) return `<div class="chat-empty">${alefSVG(false)}<p>هذا الرابط لدردشة غير موجودة على هذا الجهاز.<br>في المحاكاة تُحفظ الدردشات على الجهاز الذي أنشأها فقط.</p></div>`;
  if (!c) return `<div class="chat-empty">${alefSVG(false)}<p>أنشئ أول دردشة لتجرب كيف يُقفل الرابط على شخص واحد.</p></div>`;
  const link = chatLink(c.id);
  const roleBtns = Object.keys(ROLES).map(r => `<button type="button" data-role="${r}" aria-pressed="${CH.role === r}">${ROLES[r]}</button>`).join('');
  return `
    <div class="link-row">
      <code id="chatLinkText">${esc(link)}</code>
      <button class="chat-btn soft" type="button" data-copy>${svg('<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>')}نسخ الرابط</button>
    </div>
    <div class="roles" role="group" aria-label="جرّب المحاكاة من وجهة نظر">${roleBtns}</div>
    <p class="roles-cap">بدّل بين الأشخاص لتشاهد ما يراه كل واحد عند فتح الرابط.</p>
    <div class="chat-paper">${chatViewHTML(c)}</div>
    <div class="chat-foot">
      <span>أُنشئت ${esc(timeLabel(c.created))}</span>
      <button class="btn-text" type="button" data-del>${CH.confirmDel ? 'اضغط مرة ثانية لحذف الدردشة نهائياً' : 'حذف الدردشة'}</button>
    </div>`;
}

function chatViewHTML(c){
  const viewer = CH.role;
  if (viewer !== 'owner'){
    if (!c.claimedBy){
      const p = CH.pending && CH.pending.role === viewer && CH.pending.id === c.id ? CH.pending : null;
      return `<div class="claim">
        <span class="seal">${alefSVG(false)}</span>
        <h3>دعوة لشخص واحد</h3>
        <p>${esc(c.to ? 'أرسلها لك صاحبها.' : 'وصلك رابط دردشة خاصة.')} بفتحك لها تصبح لك وحدك مدى الحياة، ولن يستطيع أحد غيرك فتحها.</p>
        ${p ? `
          <p class="sim">في المحاكاة يظهر الرمز هنا. في الموقع الحقيقي يصل إلى بريدك: <b dir="ltr">${p.code}</b></p>
          <form id="claimCode" novalidate>
            <label class="sr-only" for="claimCodeIn">رمز التحقق</label>
            <input id="claimCodeIn" inputmode="numeric" maxlength="4" placeholder="رمز من ٤ أرقام" dir="ltr" autocomplete="one-time-code">
            <button class="chat-btn" type="submit">تأكيد</button>
            <p class="err" id="claimErr" aria-live="polite"></p>
          </form>` : `
          <form id="claimEmail" novalidate>
            <label class="sr-only" for="claimEmailIn">بريدك الإلكتروني</label>
            <input id="claimEmailIn" type="email" placeholder="name@example.com" dir="ltr" autocomplete="email">
            <button class="chat-btn" type="submit">افتح الدردشة</button>
            <p class="err" id="claimErr" aria-live="polite"></p>
          </form>`}
      </div>`;
    }
    if (c.claimedRole !== viewer){
      return `<div class="claim denied">
        <span class="seal">${svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>')}</span>
        <h3>هذه الدردشة تخص شخصاً آخر</h3>
        <p>فُتح هذا الرابط من قبل، وأصبح لصاحبه وحده. لا يمكن قراءة أي شيء منها.</p>
      </div>`;
    }
  }
  const me = viewer === 'owner' ? 'owner' : 'guest';
  const status = c.claimedBy
    ? `${svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>')}${viewer === 'owner' ? `مقفلة على ${esc(maskEmail(c.claimedBy))}` : 'هذه الدردشة لك وحدك'}`
    : `${svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>')}لم يفتح أحد الرابط بعد. رسائلك تنتظره هنا`;
  const msgs = c.messages.length
    ? c.messages.map(m => `<li class="msg${m.from === me ? ' mine' : ''}">${esc(m.text)}<small>${esc(timeLabel(m.at))}</small></li>`).join('')
    : `<li class="hint">${viewer === 'owner' ? 'اكتب أول رسالة. سيقرؤها الشخص الوحيد الذي يفتح الرابط.' : 'لا رسائل بعد. اكتب ما تحب.'}</li>`;
  return `
    <p class="chat-status">${status}</p>
    <ul class="msgs" aria-live="polite" aria-label="الرسائل">${msgs}</ul>
    <form class="composer" id="chatSend" novalidate>
      <label class="sr-only" for="chatMsg">رسالتك</label>
      <textarea id="chatMsg" rows="1" maxlength="1000" placeholder="اكتب رسالة…"></textarea>
      <button class="chat-btn" type="submit" aria-label="إرسال">${svg('<path d="M20 4L9 13M20 4l-6 16-3-7-7-3z"/>')}</button>
    </form>`;
}

function openChatLink(id, initial){
  CH.missing = chatById(id) ? null : id;
  CH.sel = id; CH.role = 'a'; CH.pending = null; CH.confirmDel = false;
  renderChats();
  if (stageOpen) closeEpisode();
  setTimeout(() => goSection('chats', !initial), initial ? 60 : 0);
}

$('#chats').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'chatNew'){
    const to = $('#chatTo').value.trim();
    const list = loadChats();
    const c = { id:newId(), to, created:Date.now(), claimedBy:null, claimedRole:null, messages:[] };
    list.push(c);
    if (!saveChats(list)){ toast('تعذّر الحفظ في هذا المتصفح.'); return; }
    CH.sel = c.id; CH.role = 'owner'; CH.pending = null; CH.missing = null; CH.confirmDel = false;
    renderChats('#chatMsg');
    toast('الرابط جاهز. انسخه وأرسله لشخص واحد.');
  }
  else if (f.id === 'claimEmail'){
    const v = $('#claimEmailIn').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){ $('#claimErr').textContent = 'اكتب بريداً إلكترونياً صحيحاً، مثل name@example.com'; $('#claimEmailIn').focus(); return; }
    CH.pending = { id:CH.sel, role:CH.role, email:v, code:String(1000 + Math.floor(Math.random()*9000)) };
    renderChats('#claimCodeIn');
  }
  else if (f.id === 'claimCode'){
    const v = $('#claimCodeIn').value.trim().replace(/[٠-٩]/g, d => AR.indexOf(d));
    if (!CH.pending || v !== CH.pending.code){ $('#claimErr').textContent = 'الرمز غير صحيح. انسخه كما يظهر فوق.'; $('#claimCodeIn').select(); return; }
    const c = chatById(CH.sel);
    if (c && c.claimedBy){ CH.pending = null; renderChats(); toast('سبقك شخص آخر وفتح الرابط.'); return; }
    updateChat(CH.sel, x => { x.claimedBy = CH.pending.email; x.claimedRole = CH.pending.role; });
    CH.pending = null;
    renderChats('#chatMsg');
    toast('صارت الدردشة لك وحدك.');
  }
  else if (f.id === 'chatSend'){
    const ta = $('#chatMsg'); const text = ta.value.trim();
    if (!text){ ta.focus(); return; }
    const from = CH.role === 'owner' ? 'owner' : 'guest';
    updateChat(CH.sel, x => x.messages.push({ from, text, at:Date.now() }));
    renderChats('#chatMsg');
  }
});
$('#chats').addEventListener('keydown', e => {
  if (e.target.id === 'chatMsg' && e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); $('#chatSend').requestSubmit ? $('#chatSend').requestSubmit() : $('#chatSend').dispatchEvent(new Event('submit', { cancelable:true, bubbles:true })); }
});
$('#chats').addEventListener('input', e => {
  if (e.target.id === 'chatMsg'){ const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(160, t.scrollHeight) + 'px'; }
  if (e.target.id === 'claimEmailIn' || e.target.id === 'claimCodeIn'){ const er = $('#claimErr'); if (er) er.textContent = ''; }
});
$('#chats').addEventListener('click', e => {
  const item = e.target.closest('[data-chat]');
  if (item){ CH.sel = item.dataset.chat; CH.role = 'owner'; CH.pending = null; CH.missing = null; CH.confirmDel = false; renderChats(`[data-chat="${CH.sel}"]`); return; }
  const role = e.target.closest('[data-role]');
  if (role){ CH.role = role.dataset.role; CH.confirmDel = false; renderChats(`[data-role="${CH.role}"]`); return; }
  if (e.target.closest('[data-copy]')){
    const txt = chatLink(CH.sel);
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#chatLinkText')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('حدّدت الرابط. انسخه يدوياً.'); };
    try { navigator.clipboard.writeText(txt).then(() => toast('نُسخ الرابط.'), fallback); } catch(err){ fallback(); }
    return;
  }
  if (e.target.closest('[data-del]')){
    if (!CH.confirmDel){ CH.confirmDel = true; renderChats('[data-del]'); return; }
    saveChats(loadChats().filter(x => x.id !== CH.sel));
    CH.sel = null; CH.confirmDel = false; CH.pending = null;
    renderChats('#chatTo'); toast('حُذفت الدردشة.');
  }
});

/* ---------- البدء ---------- */
renderScene();
renderLibraryShell();
renderResults();
renderToday();
renderBooks();
renderAbout();
renderChats();
setVol(100);
onScroll();
watchSections();
route(true);
window.addEventListener('hashchange', () => route(false));

})();
